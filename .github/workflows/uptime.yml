name: uptime

on:
  schedule:
    - cron: '*/5 * * * *'   # каждые 5 минут (минимум GitHub; запуски иногда опаздывают)
    - cron: '2 9 * * 1'     # понедельник 09:02 UTC — сводка «мониторинг жив»
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Отправить тестовое сообщение в Telegram'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Проверка доменов
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT: ${{ github.event.schedule == '2 9 * * 1' }}
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        run: bash check.sh

      - name: Сохранить состояние
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.txt)" ]; then
            git config user.name "uptime-watch"
            git config user.email "uptime-watch@users.noreply.github.com"
            git add state.txt
            git commit -q -m "state: $(date -u '+%F %H:%M') UTC"
            git push -q || echo "::warning::не удалось сохранить state.txt"
          fi
